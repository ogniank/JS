<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--HTML Challenge 1: a custom page title-->
    <title>My To-Do List</title>
    <link rel="stylesheet" href="css/todo.css">
</head>
<body>
    <!--This wrapper holds the todo entry box and the task list so CSS can center them-->
    <div id="todo-container">
        <input id="task"><button id="add">Add Item</button>
        <hr>
        <div id="todos"></div>
    </div>

    <!--HTML Challenge 2: a footer element with some footer information-->
    <footer id="footer">
        <p>My To-Do App &copy; 2026 | Built with HTML, CSS and JavaScript</p>
    </footer>

    <script src="js/todo.js"></script>
</body>
</html>
