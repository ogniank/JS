<!DOCTYPE html>
<html>
    <head>
        <!-- Load the jQuery library from Google's CDN so we can use the $ shortcut -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.0/jquery.min.js"></script>
    </head>
    <script>
        // $(document).ready() waits until the page has fully loaded
        // before running any of the jQuery code inside it
        $(document).ready(function(){
            // .append() adds new HTML to the end of the <html> element.
            // The backslash (\) at the end of each line lets the string
            // continue onto the next line.
            $("html").append(
                "<body>\
                    <div id='container'>\
                        <div id='inner'>\
                            <h1>Basic jQuery</h1>\
                            <p id='1'>Paragraph 1</p>\
                            <p id='2'>Paragraph 2</p>\
                            <p id='3'>Paragraph 3</p>\
                            <button id='toggleBtn'>Fade Paragraph 2 In/Out</button>\
                        </div>\
                    </div>\
                </body>"
            );

            // .css() changes the style of an element.
            // Here we select the element with id "2" and turn its text red.
            $("#2").css({"color":"red"});

            // .click() is an event: the code inside runs when
            // Paragraph 3 is clicked, and .hide() hides the <h1> heading.
            $("#3").click(function() {
                $("h1").hide();
            });

            // ===== jQuery Challenge, part 1: an EVENT =====
            // .dblclick() runs when Paragraph 1 is double-clicked.
            // It brings the hidden heading back and changes Paragraph 1's text.
            $("#1").dblclick(function() {
                $("h1").show();
                $(this).text("You double-clicked me, so the heading is back!");
            });

            // ===== jQuery Challenge, part 2: an EFFECT =====
            // .fadeToggle() fades Paragraph 2 out if it is visible,
            // or fades it back in if it is hidden. "slow" sets the speed.
            $("#toggleBtn").click(function() {
                $("#2").fadeToggle("slow");
            });

        });
    </script>
</html>
