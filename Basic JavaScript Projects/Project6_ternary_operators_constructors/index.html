<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ternary Operators and Constructors</title>
</head>

<body>
    <h1>Ternary Operators and Constructors</h1>

    <!-- 1. Ternary operation: the user types an age, the button checks it -->
    <h2>Ternary Operation</h2>
    <p>Enter your age:</p>
    <input id="Age" type="number">
    <button onclick="Vote_Function()">Submit</button>
    <p id="Vote"></p>

    <!-- 2 and 3. Constructor function: the button displays an object's properties -->
    <h2>Constructor Function</h2>
    <button onclick="myFunction()">Show Vehicle</button>
    <p id="Keywords_and_Constructors"></p>

    <!-- 4. Nested function: the button runs a function that contains another function -->
    <h2>Nested Function</h2>
    <button onclick="count_Function()">Count</button>
    <p id="Nested_Function"></p>

    <!-- Link to the external JavaScript file in the JS folder -->
    <script src="JS/main.js"></script>
</body>
</html>
