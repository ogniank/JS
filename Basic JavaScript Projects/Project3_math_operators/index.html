<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math Operators</title>
</head>

<body>
    <h1>JavaScript Math Operators</h1>

    <!-- Each button calls a function when clicked (onclick is the event handler) -->
    <!-- Each function shows its result in the paragraph with the matching id -->

    <button onclick="addition()">Addition (+)</button>
    <p id="Add"></p>

    <button onclick="subtraction()">Subtraction (-)</button>
    <p id="Subtract"></p>

    <button onclick="multiplication()">Multiplication (*)</button>
    <p id="Multiply"></p>

    <button onclick="modulus()">Modulus (%)</button>
    <p id="Modulus"></p>

    <button onclick="increment()">Increment (++)</button>
    <p id="Increment"></p>

    <button onclick="decrement()">Decrement (--)</button>
    <p id="Decrement"></p>

    <button onclick="randomNumber()">Random Number</button>
    <p id="Random"></p>

    <!-- Link to the external JavaScript file in the JS folder -->
    <script src="JS/main.js"></script>
</body>
</html>
