<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>String Methods</title>
</head>

<body>
    <h1>JavaScript String Methods</h1>

    <!-- Each button calls one function; the result appears in the paragraph below it -->

    <h2>concat()</h2>
    <button onclick="string_Concat()">Join the strings</button>
    <p id="Concatenate"></p>

    <h2>slice()</h2>
    <button onclick="slice_Method()">Slice the string</button>
    <p id="Slice"></p>

    <h2>toString()</h2>
    <button onclick="string_Method()">Convert number to string</button>
    <p id="Numbers_to_string"></p>

    <h2>toPrecision()</h2>
    <button onclick="precision_Method()">Set precision</button>
    <p id="Precision"></p>

    <!-- Link to the external JavaScript file in the JS folder -->
    <script src="JS/main.js"></script>
</body>
</html>
