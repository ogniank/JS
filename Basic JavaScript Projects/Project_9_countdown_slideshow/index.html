<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Countdown and Slideshow</title>
    <!-- Link to the external CSS file in the CSS folder -->
    <link rel="stylesheet" type="text/css" href="CSS/main.css">
</head>

<body>
    <!-- ===== COUNTDOWN TIMER ===== -->
    <h1>Countdown Timer</h1>
    <p>How many seconds would you like to set your alarm for?</p>
    <input id="seconds" value="" />
    <button onclick="countdown()">Click here</button>
    <p id="timer"></p>

    <!-- ===== SLIDESHOW ===== -->
    <h1>Slideshow</h1>
    <div class="slideshow-container">

        <!-- Each slide: a number, an image, and a caption -->
        <div class="mySlides fade">
            <div class="numbertext">1 / 3</div>
            <img src="images/slide1.png" alt="Slide one">
            <div class="text">Caption One</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">2 / 3</div>
            <img src="images/slide2.png" alt="Slide two">
            <div class="text">Caption Two</div>
        </div>

        <div class="mySlides fade">
            <div class="numbertext">3 / 3</div>
            <img src="images/slide3.png" alt="Slide three">
            <div class="text">Caption Three</div>
        </div>

        <!-- Previous and next arrows -->
        <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
        <a class="next" onclick="plusSlides(1)">&#10095;</a>
    </div>
    <br>

    <!-- Dots: click one to jump to that slide -->
    <div style="text-align:center">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
    </div>

    <!-- Link to the external JavaScript file in the JS folder -->
    <script src="JS/main.js"></script>
</body>
</html>
